- title: "Void"
  slug: "void"
  description: "The digital equivalent of yelling into a pillow — an anonymous venting app that extracts the core subject from your rant and visualizes the collective chaos as a live word cloud."
  long_description: "Void is a minimalist web app for venting into the abyss. Users submit short text posts which are processed by a local HuggingFace transformer pipeline (via PyCall) that extracts the core subject matter. Extraction runs as an ActiveJob background job so the UI stays snappy. Extracted subjects feed a live-updating word cloud built with React Wordcloud — a real-time window into the collective emotional chaos. It's therapeutic and anonymous. Think of it as a screaming room with data viz."
  tech_stack:
    - React
    - Rails 7
    - Sidekiq
    - Tailwind CSS
    - HuggingFace Transformers
