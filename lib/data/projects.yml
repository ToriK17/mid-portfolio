- title: "Engineering Reliable AI-Assisted Code Reviews"
  slug: "ai-code-review"
  description: "Designing an extensible multi-agent review architecture that combines specialized AI reviewers with deterministic validation, context management, and human engineering judgment."
  long_description: "A conceptual architecture for making AI code review genuinely useful in production — not just possible. The core problem: a single AI reviewer spread across the full surface of a pull request produces diluted, low-confidence feedback. This system routes diffs to specialized domain agents (security, database patterns, code quality), consolidates findings deterministically, and gates output through validation before surfacing anything to a human reviewer."
  tech_stack:
    - AI orchestration
    - Domain routing
    - Deterministic validation
    - Context engineering
    - Coverage verification
    - Token efficiency
  tags:
    - featured
    - case-study
    - ai
  case_study: true
  sections:
    - heading: "Problem"
      subheading: "Why isn't running a single AI reviewer against a pull request sufficient?"
      content: "A single AI reviewer must simultaneously reason about security vulnerabilities, database query patterns, code style, test coverage, and business logic — within a fixed context window. The result is diluted attention: the reviewer either misses domain-specific issues or produces generic, low-confidence feedback. The challenge isn't getting AI to review code. It's making that review reliably useful. A single reviewer also fails silently — there's no structural guarantee it covered the security surface at all."
    - heading: "Architecture"
      subheading: "Why separate reviewers into specialized domains?"
      content: "Domain routing: separate agents handle security, database patterns, and code quality. Each specialist receives only the diff context relevant to its domain — not the full changeset. An orchestrator dispatches diffs to the appropriate agents in parallel, then a consolidation layer deduplicates, ranks by severity, and structures findings for human review. This mirrors how experienced engineering teams structure review in practice: different experts, shared accountability. It also makes the system extensible — adding a new domain means adding a new agent, not reworking the pipeline."
    - heading: "Tradeoffs"
      subheading: "How do you balance context consumption, execution cost, and review quality?"
      content: "Specialized agents consume fewer tokens per review but require more orchestration overhead. Running agents in parallel improves throughput but increases cost and coordination complexity. Too much context risks hallucination and diluted focus; too little risks missing relevant patterns. The system must balance token budget per domain, parallelism strategy, overlap between domain boundaries, and the cost of false positives relative to missed findings. These aren't configuration parameters — they're engineering decisions that require ongoing calibration against real pull request data."
    - heading: "Reliability"
      subheading: "How do you detect missing coverage, false positives, and inconsistent agent behavior?"
      content: "The hardest problem in AI-assisted review isn't generating comments — it's knowing when the system is failing silently. Coverage gaps (a security agent that ignores a raw SQL query), false positives (flagging idiomatic Rails as a vulnerability), and nondeterminism (same diff, different outputs on successive runs) all undermine trust faster than no automation at all. Mitigations include: structural output validation to detect missing domain coverage, confidence thresholds that filter low-signal findings before they reach a reviewer, schema enforcement to ensure consistent output shape, and regression tests against known-good and known-bad diffs."
    - heading: "Lessons Learned"
      subheading: "What should remain deterministic rather than delegated to an LLM?"
      content: "Not everything should be delegated to an LLM. Structural checks (did the security agent produce output?), schema validation, test file detection, routing logic, and severity thresholds should remain deterministic code. LLMs are powerful for domain reasoning but unreliable as infrastructure components — they don't raise exceptions, they just produce plausible-sounding wrong answers. The right mental model: treat AI agents as expert consultants, not as pipeline components. Build deterministic scaffolding around them, validate their output at every boundary, and design for the case where an agent returns nothing useful."
  status: "conceptual"
  position: 1
  featured: true

- title: "Toknsmith"
  slug: "toknsmith"
  description: "A minimal, secure CLI for storing and rotating tokens — so you can stop dreading secret management."
  long_description: "A CLI-first tool for managing sensitive tokens securely, reliably, and without the pain. Supports login/logout with macOS Keychain storage, external token vaulting with encryption-at-rest, and a full GitHub OAuth browser flow that vaults the access token automatically. Built on a zero-trust, split-responsibility model: the CLI, API, and middleware each handle only what they need to — no plaintext secrets anywhere. Powered by Thor for clean command composition, Bearer Auth over HTTPS, and an external encryption layer so the API never sees raw secrets. Support for token TTLs, OAuth token rotation, and additional VCS providers in progress."
  tech_stack:
    - Ruby
    - Thor
    - Rails
    - macOS Keychain
    - OAuth 2.0
  tags:
    - featured
    - security
    - tooling
  github_url: "https://github.com/ToriK17/toknsmith-cli"
  status: in_progress
